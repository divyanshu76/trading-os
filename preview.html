<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trading OS — Android App Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #F0F3FA;
      --surface: #FFFFFF;
      --surface-variant: #E5ECF4;
      --border: #D4DFEB;
      --primary: #386382;
      --primary-dark: #182A3A;
      --profit: #357D71;
      --profit-bg: #E6F3F1;
      --loss: #A55363;
      --loss-bg: #F9EBEE;
      --warning: #B87333;
      --text: #182A3A;
      --text-muted: #5A6E82;
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      background-color: #0F1722;
      font-family: var(--font);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }
    .device-container {
      width: 100%;
      max-width: 412px;
      height: 860px;
      background: var(--bg);
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      height: 38px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      z-index: 10;
      background: var(--bg);
    }
    .camera-notch {
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
    }
    .top-bar {
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }
    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .app-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-left: 6px;
    }
    .action-icons {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: none;
    }
    .content-area::-webkit-scrollbar { display: none; }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(56, 99, 130, 0.04);
    }
    .balance-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .balance-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin: 6px 0;
      font-family: var(--font-mono);
      letter-spacing: -1px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-profit { background: var(--profit-bg); color: var(--profit); }
    .badge-loss { background: var(--loss-bg); color: var(--loss); }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .btn {
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: var(--surface); border: 1px solid var(--border); color: var(--text); }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }
    .kpi-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .kpi-val { font-size: 22px; font-weight: 800; margin: 4px 0 2px; font-family: var(--font-mono); }
    .kpi-sub { font-size: 11px; color: var(--text-muted); }

    .trade-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .trade-sym { font-weight: 800; font-size: 15px; }
    .trade-pnl { font-weight: 800; font-size: 16px; font-family: var(--font-mono); }
    .trade-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 8px;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 16px;
    }
    .nav-item.active {
      color: var(--primary);
      font-weight: 800;
      background: var(--surface-variant);
    }
    .nav-icon { font-size: 18px; }

    /* Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }
    .modal-card {
      background: var(--surface);
      width: 100%;
      border-radius: 28px 28px 0 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 80%;
      overflow-y: auto;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .input-box {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      font-family: var(--font);
    }
    .input-box:focus { border-color: var(--primary); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>

  <div class="device-container">
    <div class="status-bar">
      <span>09:41</span>
      <div class="camera-notch"></div>
      <span>5G 98%</span>
    </div>

    <div class="top-bar">
      <div>
        <span class="app-title">Trading OS</span>
        <span class="app-subtitle" id="top-screen-title">• Dashboard</span>
      </div>
      <div class="action-icons">
        <div class="icon-btn" onclick="switchTab('calculator')">🧮</div>
        <div class="icon-btn" onclick="switchTab('risk')">🛡️</div>
      </div>
    </div>

    <div class="content-area" id="main-content"></div>

    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('dashboard')" id="nav-dashboard">
        <span class="nav-icon">📊</span>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="switchTab('trades')" id="nav-trades">
        <span class="nav-icon">📖</span>
        <span>Journal</span>
      </div>
      <div class="nav-item" onclick="switchTab('analytics')" id="nav-analytics">
        <span class="nav-icon">📈</span>
        <span>Analytics</span>
      </div>
      <div class="nav-item" onclick="switchTab('propfirms')" id="nav-propfirms">
        <span class="nav-icon">🎯</span>
        <span>Prop</span>
      </div>
      <div class="nav-item" onclick="switchTab('calendar')" id="nav-calendar">
        <span class="nav-icon">📅</span>
        <span>Calendar</span>
      </div>
    </div>

    <!-- Trade Entry Modal -->
    <div class="modal-overlay" id="trade-modal">
      <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-weight:800; font-size:18px;">Log New Trade</h3>
          <span style="cursor:pointer; font-size:20px;" onclick="closeModal()">✕</span>
        </div>
        
        <div class="row-2">
          <div class="input-group">
            <span class="input-label">Symbol</span>
            <input type="text" id="m-sym" class="input-box" value="XAUUSD">
          </div>
          <div class="input-group">
            <span class="input-label">Direction</span>
            <select id="m-dir" class="input-box">
              <option value="LONG">LONG / BUY</option>
              <option value="SHORT">SHORT / SELL</option>
            </select>
          </div>
        </div>

        <div class="row-2">
          <div class="input-group">
            <span class="input-label">Lot Size</span>
            <input type="number" id="m-lots" class="input-box" value="1.0" step="0.01">
          </div>
          <div class="input-group">
            <span class="input-label">Entry Price</span>
            <input type="number" id="m-entry" class="input-box" value="2650.0">
          </div>
        </div>

        <div class="row-2">
          <div class="input-group">
            <span class="input-label">Exit Price</span>
            <input type="number" id="m-exit" class="input-box" value="2665.0">
          </div>
          <div class="input-group">
            <span class="input-label">Stop Loss</span>
            <input type="number" id="m-sl" class="input-box" value="2640.0">
          </div>
        </div>

        <div class="input-group">
          <span class="input-label">Trade Notes / Setup</span>
          <input type="text" id="m-notes" class="input-box" placeholder="e.g. London sweep of Asian high">
        </div>

        <button class="btn btn-primary" style="height:48px;" onclick="saveNewTrade()">Save Trade</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'dashboard';
    let trades = [
      { id: 1, date: '2026-09-30', sym: 'XAUUSD', dir: 'LONG', lots: 1.5, entry: 2650.5, exit: 2668.2, pnl: 2640.0, r: 2.1, session: 'New York' },
      { id: 2, date: '2026-09-29', sym: 'EURUSD', dir: 'SHORT', lots: 2.0, entry: 1.0880, exit: 1.0845, pnl: 686.0, r: 1.9, session: 'London' },
      { id: 3, date: '2026-09-28', sym: 'NAS100', dir: 'LONG', lots: 3.0, entry: 20150.0, exit: 20080.0, pnl: -228.0, r: -1.0, session: 'New York' },
      { id: 4, date: '2026-09-25', sym: 'GBPUSD', dir: 'LONG', lots: 2.0, entry: 1.3320, exit: 1.3385, pnl: 1288.0, r: 2.15, session: 'London' }
    ];

    function renderScreen() {
      const container = document.getElementById('main-content');
      const title = document.getElementById('top-screen-title');
      const totalPnl = trades.reduce((acc, t) => acc + t.pnl, 0);
      const balance = 10000 + totalPnl;
      const wins = trades.filter(t => t.pnl > 0);
      const winRate = ((wins.length / trades.length) * 100).toFixed(1);

      if (currentTab === 'dashboard') {
        title.innerText = '• Dashboard';
        container.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="balance-label">Authoritative Balance</span>
              <span class="badge badge-profit">LIVE USD</span>
            </div>
            <div class="balance-value">$` + balance.toLocaleString('en-US', { minimumFractionDigits: 2 }) + `</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge badge-profit">+$` + totalPnl.toFixed(2) + ` all-time net</span>
              <span style="font-size:12px; color:var(--text-muted);">from ` + trades.length + ` trades</span>
            </div>
          </div>

          <div class="quick-actions">
            <button class="btn btn-primary" onclick="openModal()">+ Log Trade</button>
            <button class="btn btn-outline" onclick="switchTab('calculator')">🧮 Calc</button>
            <button class="btn btn-outline" onclick="switchTab('propfirms')">🎯 Prop</button>
          </div>

          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">Win Rate</div>
              <div class="kpi-val" style="color:var(--profit);">` + winRate + `%</div>
              <div class="kpi-sub">` + wins.length + `W / ` + (trades.length - wins.length) + `L</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Profit Factor</div>
              <div class="kpi-val">2.84</div>
              <div class="kpi-sub">High edge</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Expectancy</div>
              <div class="kpi-val" style="color:var(--profit);">+$1.24 R</div>
              <div class="kpi-sub">Per trade average</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Max Drawdown</div>
              <div class="kpi-val" style="color:var(--loss);">4.2%</div>
              <div class="kpi-sub">$228.00 peak</div>
            </div>
          </div>

          <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
              <span class="balance-label">Equity Curve</span>
              <span style="font-size:12px; font-weight:700; color:var(--profit);">+$` + totalPnl.toFixed(2) + `</span>
            </div>
            <svg viewBox="0 0 300 90" style="width:100%; height:90px;">
              <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#386382" stop-opacity="0.3"/>
                  <stop offset="100%" stop-color="#386382" stop-opacity="0.0"/>
                </linearGradient>
              </defs>
              <path d="M 0,90 L 0,80 L 75,70 L 150,55 L 225,65 L 300,15 L 300,90 Z" fill="url(#grad)" />
              <path d="M 0,80 L 75,70 L 150,55 L 225,65 L 300,15" fill="none" stroke="#386382" stroke-width="3" />
              <circle cx="300" cy="15" r="4" fill="#182A3A" />
            </svg>
          </div>

          <div>
            <div style="font-size:13px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;">Recent Trades</div>
            ` + trades.map(t => `
              <div class="trade-item">
                <div>
                  <div class="trade-sym">` + t.sym + ` <span class="badge ` + (t.dir === 'LONG' ? 'badge-profit' : 'badge-loss') + `" style="font-size:10px;">` + t.dir + `</span></div>
                  <div class="trade-sub">` + t.lots + ` lots • ` + t.session + ` • ` + t.date + `</div>
                </div>
                <div style="text-align:right;">
                  <div class="trade-pnl" style="color:` + (t.pnl >= 0 ? 'var(--profit)' : 'var(--loss)') + `;">` + (t.pnl >= 0 ? '+' : '') + `$` + t.pnl.toFixed(2) + `</div>
                  <div class="trade-sub">` + (t.r >= 0 ? '+' : '') + t.r + `R</div>
                </div>
              </div>
            `).join('') + `
          </div>
        `;
      } else if (currentTab === 'trades') {
        title.innerText = '• Journal';
        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:800; font-size:18px;">All Logged Trades</span>
            <button class="btn btn-primary" onclick="openModal()" style="padding:6px 12px; font-size:12px;">+ Add</button>
          </div>
          ` + trades.map(t => `
            <div class="trade-item">
              <div>
                <div class="trade-sym">` + t.sym + ` <span class="badge ` + (t.dir === 'LONG' ? 'badge-profit' : 'badge-loss') + `" style="font-size:10px;">` + t.dir + `</span></div>
                <div class="trade-sub">In: ` + t.entry + ` • Out: ` + t.exit + ` • ` + t.lots + ` lots</div>
                <div class="trade-sub" style="color:var(--primary); font-weight:600;">` + t.session + ` Session</div>
              </div>
              <div style="text-align:right;">
                <div class="trade-pnl" style="color:` + (t.pnl >= 0 ? 'var(--profit)' : 'var(--loss)') + `;">` + (t.pnl >= 0 ? '+' : '') + `$` + t.pnl.toFixed(2) + `</div>
                <div class="trade-sub" style="font-weight:700;">` + (t.r >= 0 ? '+' : '') + t.r + `R</div>
              </div>
            </div>
          `).join('') + `
        `;
      } else if (currentTab === 'analytics') {
        title.innerText = '• Analytics';
        container.innerHTML = `
          <div class="card">
            <span class="balance-label">Performance Edge</span>
            <div class="kpi-grid" style="margin-top:12px;">
              <div class="kpi-card">
                <div class="kpi-label">Win Rate</div>
                <div class="kpi-val" style="color:var(--profit);">` + winRate + `%</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Profit Factor</div>
                <div class="kpi-val">2.84</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Avg Win</div>
                <div class="kpi-val" style="color:var(--profit);">+$1,538</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Avg Loss</div>
                <div class="kpi-val" style="color:var(--loss);">-$228</div>
              </div>
            </div>
          </div>

          <div class="card">
            <span class="balance-label">Streaks & Discipline</span>
            <div style="display:flex; justify-content:space-between; margin-top:14px;">
              <div>
                <div style="font-size:12px; color:var(--text-muted);">Best Streak</div>
                <div style="font-size:18px; font-weight:800; color:var(--profit);">3 Wins</div>
              </div>
              <div>
                <div style="font-size:12px; color:var(--text-muted);">Max Loss Streak</div>
                <div style="font-size:18px; font-weight:800; color:var(--loss);">1 Loss</div>
              </div>
              <div>
                <div style="font-size:12px; color:var(--text-muted);">Current Streak</div>
                <div style="font-size:18px; font-weight:800; color:var(--profit);">2 Wins</div>
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'propfirms') {
        title.innerText = '• Prop Firms';
        container.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <div>
                <span class="balance-label">FTMO 100K EVALUATION</span>
                <h3 style="font-size:18px; font-weight:800; margin-top:4px;">Phase 1 Challenge</h3>
              </div>
              <span class="badge badge-profit">ACTIVE</span>
            </div>
            <div style="margin:16px 0;">
              <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px;">
                <span>Profit Target: $4,250 / $10,000</span>
                <span style="color:var(--profit);">42.5%</span>
              </div>
              <div style="background:var(--surface-variant); height:8px; border-radius:4px; overflow:hidden;">
                <div style="background:var(--profit); width:42.5%; height:100%;"></div>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);">
              <span>Daily Loss Buffer: $5,000</span>
              <span>Max DD Limit: $10,000</span>
            </div>
          </div>
        `;
      } else if (currentTab === 'calculator') {
        title.innerText = '• Calculator';
        container.innerHTML = `
          <div class="card">
            <span class="balance-label">Position Size Calculator</span>
            <div style="font-size:36px; font-weight:800; color:var(--primary); margin:10px 0; font-family:var(--font-mono);" id="calc-result">1.25 Lots</div>
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <span>Max Cash Risk: <b style="color:var(--loss);">$100.00</b></span>
              <span>Stop Distance: <b>10.0 pts</b></span>
            </div>
          </div>
          <div class="card" style="display:flex; flex-direction:column; gap:12px;">
            <div class="row-2">
              <div class="input-group">
                <span class="input-label">Balance ($)</span>
                <input type="number" id="c-bal" class="input-box" value="10000" oninput="recalc()">
              </div>
              <div class="input-group">
                <span class="input-label">Risk (%)</span>
                <input type="number" id="c-risk" class="input-box" value="1.0" step="0.1" oninput="recalc()">
              </div>
            </div>
            <div class="row-2">
              <div class="input-group">
                <span class="input-label">Entry Price</span>
                <input type="number" id="c-entry" class="input-box" value="2650.0" oninput="recalc()">
              </div>
              <div class="input-group">
                <span class="input-label">Stop Loss</span>
                <input type="number" id="c-sl" class="input-box" value="2640.0" oninput="recalc()">
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'risk') {
        title.innerText = '• Risk Manager';
        container.innerHTML = `
          <div class="card" style="background:var(--profit-bg); border-color:var(--profit);">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:24px;">🛡️</span>
              <div>
                <div style="font-weight:800; color:var(--profit);">STATUS: SAFE</div>
                <div style="font-size:12px; color:var(--text);">All daily risk limits are fully preserved.</div>
              </div>
            </div>
          </div>
          <div class="card">
            <span class="balance-label">Active Rules</span>
            <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px; font-size:13px;">
              <div style="display:flex; justify-content:space-between;"><span>Max Daily Loss</span><b>$500.00 (3.0%)</b></div>
              <div style="display:flex; justify-content:space-between;"><span>Max Trades Per Day</span><b>4 trades max</b></div>
              <div style="display:flex; justify-content:space-between;"><span>Trailing Max Drawdown</span><b>8.0% limit</b></div>
            </div>
          </div>
        `;
      } else if (currentTab === 'calendar') {
        title.innerText = '• Calendar';
        container.innerHTML = `
          <div class="card">
            <span class="balance-label">Daily P&L Calendar</span>
            <div style="display:flex; gap:10px; margin-top:10px;">
              <div class="kpi-card" style="flex:1;">
                <div class="kpi-label">Winning Days</div>
                <div class="kpi-val" style="color:var(--profit);">3 Days</div>
              </div>
              <div class="kpi-card" style="flex:1;">
                <div class="kpi-label">Losing Days</div>
                <div class="kpi-val" style="color:var(--loss);">1 Day</div>
              </div>
            </div>
          </div>
          ` + trades.map(t => `
            <div class="trade-item">
              <div>
                <div class="trade-sym">` + t.date + `</div>
                <div class="trade-sub">` + t.sym + ` (` + t.dir + `) • ` + t.session + `</div>
              </div>
              <div class="trade-pnl" style="color:` + (t.pnl >= 0 ? 'var(--profit)' : 'var(--loss)') + `;">` + (t.pnl >= 0 ? '+' : '') + `$` + t.pnl.toFixed(2) + `</div>
            </div>
          `).join('') + `
        `;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('nav-' + tab);
      if (activeEl) activeEl.classList.add('active');
      renderScreen();
    }

    function openModal() {
      document.getElementById('trade-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('trade-modal').style.display = 'none';
    }

    function saveNewTrade() {
      const sym = document.getElementById('m-sym').value.toUpperCase();
      const dir = document.getElementById('m-dir').value;
      const lots = parseFloat(document.getElementById('m-lots').value) || 1.0;
      const entry = parseFloat(document.getElementById('m-entry').value) || 0;
      const exit = parseFloat(document.getElementById('m-exit').value) || 0;
      const sl = parseFloat(document.getElementById('m-sl').value) || 0;
      const diff = dir === 'LONG' ? exit - entry : entry - exit;
      const pnl = Math.round(diff * 100 * lots * 100) / 100;
      const r = Math.round((pnl / 200) * 10) / 10;

      trades.unshift({
        id: Date.now(),
        date: new Date().toISOString().split('T')[0],
        sym, dir, lots, entry, exit, pnl, r, session: 'London'
      });
      closeModal();
      renderScreen();
    }

    function recalc() {
      const b = parseFloat(document.getElementById('c-bal').value) || 10000;
      const r = parseFloat(document.getElementById('c-risk').value) || 1;
      const en = parseFloat(document.getElementById('c-entry').value) || 2650;
      const sl = parseFloat(document.getElementById('c-sl').value) || 2640;
      const dist = Math.abs(en - sl);
      if (dist > 0) {
        const riskCash = (b * r) / 100;
        const lots = Math.max(0.01, Math.round((riskCash / (dist * 100)) * 100) / 100);
        const res = document.getElementById('calc-result');
        if (res) res.innerText = lots + ' Lots';
      }
    }

    renderScreen();
  </script>
</body>
</html>
